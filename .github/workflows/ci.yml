name: CI / CD

# Vercel (GitHub integration) and Render (render.yaml) both build every push to `main` and promote
# it to the URLs in deploy.config.json. This workflow adds:
#   1. validation on every push / PR (lint, build, server load, unit tests)
#   2. a live smoke test after each successful Vercel production deployment
#   3. a wait-until-live check and smoke test of the Render deployment
# The live URLs are listed in each run's summary.

on:
  push:
    branches: [main]
  pull_request:
  deployment_status:
  workflow_dispatch:

jobs:
  validate:
    if: github.event_name != 'deployment_status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Install
        run: npm ci --include=dev --prefix client && npm ci --prefix server
      - name: Lint, build and test
        run: node scripts/verify.mjs

  smoke-test-production:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test live site
        run: node scripts/smoke-test.mjs vercel

  # Render deploys every push to `main` on its own (render.yaml). This waits until the Render URL
  # is serving the pushed commit, then smoke tests it. Skipped while the service does not exist.
  smoke-test-render:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Render to serve this commit
        id: wait
        run: |
          set +e
          node scripts/wait-for-deploy.mjs render ${{ github.sha }} 20
          code=$?
          if [ "$code" = "2" ]; then echo "live=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "live=true" >> "$GITHUB_OUTPUT"
          exit $code
      - name: Smoke test Render site
        if: steps.wait.outputs.live == 'true'
        run: node scripts/smoke-test.mjs render
